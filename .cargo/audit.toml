# cargo-audit configuration (read automatically by `cargo audit` from the workspace root).
# Every ignore says why it is safe, when it was last reviewed, and what would let us drop
# it. Re-check them when upgrading openidconnect.

[advisories]
ignore = [
    # rsa 0.9 Marvin attack: timing leak in RSA *private-key* decryption. Pulled in by
    # openidconnect 4 (no rsa 0.10 support yet), which only uses public-key signature
    # verification of ID tokens; we never hold or use an RSA private key. Reviewed 2026-11.
    "RUSTSEC-2023-0071",
]
