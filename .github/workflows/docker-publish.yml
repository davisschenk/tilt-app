name: Build and Publish Docker Image

on:
  push:
    branches: [master]
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      OTA_SIGNING_KEY:
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Builds the ESP32 firmware once; the server image bakes it in at /app/firmware
  # so the web flasher and OTA updates always match the server version.
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libusb-1.0-0 libudev-dev python3-venv ccache

      - name: Install ESP Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6.0
        with:
          version: "1.93.0.0"
          ldproxy: true
          buildtargets: esp32

      - name: Cache ESP-IDF and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.cargo/bin/espflash
            esp32-client/target
            esp32-client/.embuild
          key: esp32-${{ runner.os }}-${{ hashFiles('esp32-client/Cargo.lock', 'esp32-client/.cargo/config.toml', 'esp32-client/sdkconfig.defaults') }}
          restore-keys: esp32-${{ runner.os }}-

      - name: Install espflash
        run: command -v espflash >/dev/null || cargo install espflash --locked --version 3.2.0

      - name: Build firmware images
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          TILT_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/ota-signing.pem"' EXIT
          if [ -n "$TILT_RELEASE_VERSION" ] && [ -z "$OTA_SIGNING_KEY" ]; then
            echo "A signed release requires OTA_SIGNING_KEY" >&2
            exit 1
          fi
          if [ -n "$OTA_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota-signing.pem"
            export OTA_SIGNING_KEY_FILE="$RUNNER_TEMP/ota-signing.pem"
          fi
          ./esp32-client/scripts/release.sh
          rm -f "$RUNNER_TEMP/ota-signing.pem"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dist
          path: |
            firmware-dist/*.bin
            firmware-dist/manifest.json
          if-no-files-found: error

  build-and-push:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-dist
          path: firmware-dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,prefix=sha-,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
