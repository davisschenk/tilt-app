name: Dependency Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 06:00 UTC: catches advisories published against unchanged lockfiles.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # RustSec advisories against the workspace Cargo.lock (server, migration, shared).
  # Accepted advisories are listed with justifications in .cargo/audit.toml.
  cargo-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit and just
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,just

      - name: Audit Cargo.lock
        run: just audit-rust

  # Production (non-dev) npm dependencies of the web UI; fails on high or critical.
  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Audit web dependencies
        run: just audit-web
