name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: tilt-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Calculate next release version
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          test "$GITHUB_REF" = refs/heads/master || { echo "Run releases from master" >&2; exit 1; }
          python3 - <<'PY'
          import os
          import re
          import subprocess

          pattern = r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          tags = subprocess.check_output(["git", "tag"], text=True).splitlines()
          versions = [tuple(map(int, match.groups())) for tag in tags
                      if (match := re.fullmatch(pattern, tag))]
          version = list(max(versions, default=(0, 0, 0)))
          index = {"major": 0, "minor": 1, "patch": 2}[os.environ["RELEASE_BUMP"]]
          version[index] += 1
          version[index + 1:] = [0] * (2 - index)
          version = ".".join(map(str, version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          print(f"Releasing v{version}")
          PY

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  audit:
    needs: validate
    uses: ./.github/workflows/audit.yml

  publish:
    needs: [validate, test, audit]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets:
      OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}

  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware-dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd firmware-dist
          sha256sum ./*.bin manifest.json > SHA256SUMS
          gh release create "v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" \
            --title "Tilt $RELEASE_VERSION" \
            --generate-notes \
            ./*.bin manifest.json SHA256SUMS
